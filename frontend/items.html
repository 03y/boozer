<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>🍺 Boozer</title>
        <link rel="stylesheet" type="text/css" href="styles/style.css" />
        <link rel="stylesheet" type="text/css" href="styles/leaderboard.css" />
        <script src="scripts/auth.js"></script>
    </head>
    <body>
        <nav>
            <a href="./index.html">Leaderboard</a>
            <a href="./items.html" class="active">Inventory</a>
            <a id="login-link" href="./login.html">Login</a>
            <a href="./submit.html">Get boozing!</a>
        </nav>

        <div class="container">
            <div class="card profile-section" id="items-count-card" style="text-align: center;">
                <h3 style="margin-top: 0;">🍺 Inventory</h3>
                <p id="items-count-text" style="margin-bottom: 0; font-size: 1.1em;">
                    Item count: <strong id="items-count">...</strong>
                </p>
            </div>
        </div>

        <div class="container">
            <div class="items-section">
                <div class="leaderboard-controls">
                    <input
                        type="text"
                        id="item-search"
                        placeholder="Search items..."
                        autocomplete="off"
                    />
                    <select id="sort-selector">
                        <option value="date">📅 Date Added</option>
                        <option value="alpha">🔤 Alphabetical</option>
                        <option value="units">📊 Units</option>
                    </select>
                </div>
                <div id="items-container">
                    <div class="loading">Loading inventory...</div>
                </div>
            </div>
        </div>

        <script>
            let itemsData = [];
            const container = document.getElementById("items-container");

            async function fetchItems() {
                try {
                    const response = await fetch(`${API_BASE_URL}/items`);
                    if (!response.ok) {
                        throw new Error("Failed to fetch items");
                    }
                    return await response.json();
                } catch (error) {
                    console.error("Error fetching inventory:", error);
                    throw error;
                }
            }

            // Fold diacritics / accents so e.g. "Zywiec" matches "Żywiec"
            // and "Perla" matches "Perła".
            // Characters like ł, ø, đ have no NFD decomposition, so we
            // substitute them explicitly before the NFD pass.
            const FOLD_MAP = {
                'ł': 'l', 'Ł': 'L',
                'ø': 'o', 'Ø': 'O',
                'đ': 'd', 'Đ': 'D',
                'ß': 'ss',
                'æ': 'ae', 'AE': 'AE',
                'œ': 'oe', 'Œ': 'OE',
                'ð': 'd', 'Ð': 'D',
                'þ': 'th', 'Þ': 'Th',
            };
            const FOLD_RE = new RegExp('[' + Object.keys(FOLD_MAP).join('') + ']', 'g');

            function foldDiacritics(str) {
                return str
                    .replace(FOLD_RE, ch => FOLD_MAP[ch])
                    .normalize("NFD")
                    .replace(/[\u0300-\u036f]/g, "");
            }

            // Pre-compute folded search name on each item after loading
            function prepareSearchNames(list) {
                for (const item of list) {
                    item._searchName = item.name ? foldDiacritics(item.name.toLowerCase()) : "";
                }
            }

            function getFilteredItems() {
                const searchInput = document.getElementById("item-search");
                const filter = searchInput ? searchInput.value.trim() : "";
                if (!filter) {
                    return itemsData;
                }
                const foldedFilter = foldDiacritics(filter.toLowerCase());
                return itemsData.filter((item) =>
                    item._searchName && item._searchName.includes(foldedFilter),
                );
            }

            function renderTable() {
                if (!itemsData || itemsData.length === 0) {
                    container.innerHTML = `<div class="error">Inventory is empty.</div>`;
                    return;
                }

                const displayItems = getFilteredItems();

                let tableHTML = `
                    <table>
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>Units</th>
                                <th>Date added</th>
                            </tr>
                        </thead>
                        <tbody>
                `;

                displayItems.forEach((item) => {
                    const date = new Date(item.added * 1000);
                    const formattedDate = date.toISOString().split("T")[0];
                    tableHTML += `
                        <tr>
                            <td>${item.name ? `<a href="./item.html?name=${encodeURIComponent(item.name)}">${item.name}</a>` : "Unknown Item"}</td>
                            <td>${item.units || 0}</td>
                            <td>${formattedDate}</td>
                        </tr>
                    `;
                });

                tableHTML += `
                        </tbody>
                    </table>
                `;
                container.innerHTML = tableHTML;
            }

            function sortData(criteria) {
                switch (criteria) {
                    case 'date':
                        itemsData.sort((a, b) => b.added - a.added);
                        break;
                    case 'alpha':
                        itemsData.sort((a, b) => a.name.localeCompare(b.name));
                        break;
                    case 'units':
                        itemsData.sort((a, b) => b.units - a.units);
                        break;
                }
                renderTable();
            }

            async function loadItems() {
                container.innerHTML = '<div class="loading">Loading inventory...</div>';
                try {
                    const data = await fetchItems();
                    itemsData = data || [];
                    prepareSearchNames(itemsData);
                    const count = itemsData.length;
                    const countTextElem = document.getElementById("items-count-text");
                    if (countTextElem) {
                        countTextElem.innerHTML = `Item count: <strong id="items-count">${count}</strong>`;
                    }
                    sortData('date');
                } catch (error) {
                    container.innerHTML = `
                        <div class="error">
                            <strong>Error loading items</strong><br>
                        </div>
                    `;
                    const countTextElem = document.getElementById("items-count-text");
                    if (countTextElem) {
                        countTextElem.textContent = "Error loading item count.";
                    }
                }
            }

            document.getElementById('sort-selector').addEventListener('change', function () {
                sortData(this.value);
            });

            document.getElementById('item-search').addEventListener('input', function () {
                renderTable();
            });

            document.addEventListener("DOMContentLoaded", loadItems);
            document.addEventListener("DOMContentLoaded", getUser);
        </script>
    </body>
</html>
